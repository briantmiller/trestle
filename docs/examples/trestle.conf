# Example /etc/trestle/trestle.conf with three networks.

[global]
# only members of "containers" may talk to trestled at all
socket_group = containers
socket_mode = 0770
ip_forward = yes
# with the SELinux module loaded:
#server_selinux_type = trestled_t

# Private routed network for developers, NATed to the outside, with DNS.
[network:dev]
users = @developers, !intern
subnet = 10.42.0.1/24
mtu = 1450
hosts_file = yes
aardvark_dns = yes
firewall = yes
masquerade = yes
outbound_policy = accept
inbound_policy = drop
allow_inbound = tcp:22, tcp:8000-8099, icmp
allow_inbound_from = 192.168.10.0/24
nft_rule = ip daddr 169.254.169.254 drop

# Containers directly on the LAN through an existing bridge with a physical
# uplink. No addressing by trestle (the LAN's DHCP/static config applies).
[network:lan]
users = alice, bob
bridge = br0
uplink = eno2

# Any other network name (e.g. "podman network create -d trestle team-x"):
# its own bridge and a /24 out of 10.100.0.0/16 for each network.
[network:*]
users = @developers
subnet_pool = 10.100.0.0/16
subnet_prefix = 24
firewall = yes
masquerade = yes

# Kubernetes pods (the CRI runtime calls CNI plugins as root).
[network:k8s]
users = root
subnet = 10.244.7.1/24
dnsmasq_hosts = /etc/dnsmasq.d/trestle-k8s.hosts
dnsmasq_pid_file = /run/dnsmasq.pid
firewall = yes
masquerade = yes
inbound_policy = accept
